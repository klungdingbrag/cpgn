<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Company Profile Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="min-h-screen text-slate-800">
  <header class="bg-slate-950 text-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-5">
      <div class="flex items-center gap-3">
        <img src="frontend/assets/logo.svg" alt="" class="h-10 w-10">
        <div><p class="text-xs uppercase tracking-[.25em] text-teal-300">Studio</p><h1 class="text-xl font-semibold">Company Profile Generator</h1></div>
      </div>
      <span class="rounded-full border border-slate-700 px-3 py-1 text-xs text-slate-300">Draft tersinkron lokal</span>
    </div>
  </header>
  <main class="mx-auto grid max-w-6xl gap-6 px-5 py-8 lg:grid-cols-[260px_1fr]">
    <aside class="rounded-2xl bg-white p-5 shadow-sm">
      <label for="businessScale" class="mb-2 block text-sm font-medium">Skala bisnis</label>
      <select id="businessScale" class="field">
        <option value="startup">Startup / UKM · 4–8 halaman</option>
        <option value="mid">Menengah · 8–16 halaman</option>
        <option value="corporate">Korporat · 20–40 halaman</option>
      </select>
      <nav id="stepNav" class="mt-6 space-y-2" aria-label="Tahapan formulir"></nav>
      <div class="mt-6 border-t border-slate-100 pt-5">
        <label for="profileId" class="mb-2 block text-sm font-medium">ID profil cloud</label>
        <input id="profileId" class="field text-xs" placeholder="Dibuat saat pertama kali menyimpan">
        <button id="loadButton" type="button" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-50">Muat profil dari cloud</button>
      </div>
      <p class="mt-5 text-xs leading-5 text-slate-500">Draft disimpan otomatis di browser ini. Simpan ke cloud untuk membuat profil yang dapat dimuat kembali dengan ID.</p>
    </aside>
    <section class="rounded-2xl bg-white p-6 shadow-sm sm:p-8">
      <div class="mb-6 flex items-start justify-between gap-4">
        <div><p id="stepCount" class="text-xs font-semibold uppercase tracking-wider text-teal-700"></p><h2 id="stepTitle" class="mt-1 text-2xl font-semibold"></h2><p id="stepHint" class="mt-1 text-sm text-slate-500"></p></div>
        <button id="saveButton" type="button" class="shrink-0 rounded-xl bg-teal-700 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-800">Simpan ke cloud</button>
      </div>
      <form id="profileForm" class="space-y-5" novalidate></form>
      <div id="reviewSummary" class="hidden rounded-xl bg-slate-50 p-5"></div>
      <div class="mt-8 flex justify-between border-t border-slate-100 pt-5">
        <button id="backButton" type="button" class="rounded-xl px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">← Kembali</button>
        <button id="nextButton" type="button" class="rounded-xl bg-slate-900 px-5 py-2 text-sm font-semibold text-white hover:bg-slate-800">Lanjut →</button>
      </div>
      <p id="status" class="mt-4 min-h-5 text-sm" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="frontend/js/app.js"></script>
</body>
</html>
